name: validar HTML

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


    jobss:
      validar:
        name: crear maquina virtual
        runs-on: ubuntu-latest

        steps:
          - name: clonar el codigo
            uses: actions/checkout@v4

          - name: instalar node
            uses: actions/setup-node@v4
            with:
              node-version: 22
              
              -name: validar codigo HTML
              run: |
                   echo "inicio"
                   npx html-validate "**/*.html"
                   echo "fin"